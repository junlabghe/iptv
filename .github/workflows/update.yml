name: 每日更新直播源

on:
  schedule:
    # 每天 06:00 北京时间（UTC 前一天 22:00）
    - cron: '0 22 * * *'
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成直播源
        run: python3 iptv_update.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tv.m3u tv.txt
          git diff --cached --quiet || git commit -m "自动更新直播源 $(date -u +%Y-%m-%d)"
          git push
